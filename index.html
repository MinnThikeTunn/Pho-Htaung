<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a08" />
    <title>ဖိုးထောင် — ပုဂံရွှေမြို့တော် စွန့်စားခန်း</title>
    <link rel="icon" type="image/jpeg" href="/logo_outside.jpg" />
    <link rel="shortcut icon" href="/logo_outside.jpg" />
    <link rel="apple-touch-icon" href="/logo_outside.jpg" />
    <meta name="description" content="Phoe Htaung: a Burmese cartoon puzzle and action adventure." />
  </head>
  <body>
    <div id="portrait-shield" class="portrait-shield" aria-hidden="true">
      <div class="shield-content">
        <div class="spinning-loop-icon" aria-label="Rotate device to landscape">
          <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </div>
        <h2 class="shield-text">စခရင်ကို ဘေးတိုက်လှည့်ပါ</h2>
      </div>
    </div>
    <div class="game-viewport-frame">
      <!-- Central Game Canvas Frame -->
      <main id="app">
        <div id="game"></div>
        <div id="interface"></div>
        <div id="volume-control">
          <button type="button" id="volume-toggle-btn" aria-label="အသံ ဖွင့်/ပိတ်" title="အသံ ဖွင့်/ပိတ် (Sound Mute/Unmute)">
            <span id="volume-icon">🔊</span>
          </button>
        </div>
        <div id="boot-splash">
          <div class="boot-splash-inner">
            <div class="boot-splash-title">ဖိုးထောင်</div>
            <div class="boot-splash-sub">PHO HTAUNG</div>
            <div class="boot-splash-bar"><span></span></div>
            <div class="boot-splash-note">ဂိမ်းကို ပြင်ဆင်နေသည်… / Loading…</div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
