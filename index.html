  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0c0a08;
      position: fixed;
      inset: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Myanmar', sans-serif;
      cursor: url('/assets/cursors/cursor-default.svg') 3 3, default;
      touch-action: none;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: url('/assets/cursors/cursor-default.svg') 3 3, default;
    }

    #game-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Machinarium artisan hand pointer for interactive elements */
    .pointer, [data-interactive="true"], button, a {
      cursor: url('/assets/cursors/cursor-interactive.svg') 11 6, pointer !important;
    }
  </style>

<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
