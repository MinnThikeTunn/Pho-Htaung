<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a180e"/>
      <stop offset="100%" stop-color="#0c0a08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#d97706" stroke-width="2"/>

  <!-- Ancient Bagan Temple Silhouette & Spire -->
  <!-- Stupa Base Terraces -->
  <rect x="14" y="44" width="36" height="6" rx="2" fill="url(#gold)"/>
  <rect x="18" y="38" width="28" height="6" rx="1.5" fill="url(#gold)"/>
  <rect x="22" y="32" width="20" height="6" rx="1" fill="url(#gold)"/>

  <!-- Bell Shape Dome -->
  <ellipse cx="32" cy="27" rx="9" ry="6" fill="url(#gold)"/>

  <!-- Spire (Hti) -->
  <polygon points="30,22 34,22 32,10" fill="url(#gold)"/>
  <circle cx="32" cy="9" r="2" fill="#fef08a"/>

  <!-- Steampunk Cog teeth on outer ring -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.65">
    <line x1="32" y1="2" x2="32" y2="5"/>
    <line x1="32" y1="59" x2="32" y2="62"/>
    <line x1="2" y1="32" x2="5" y2="32"/>
    <line x1="59" y1="32" x2="62" y2="32"/>
    <line x1="11" y1="11" x2="13" y2="13"/>
    <line x1="51" y1="51" x2="53" y2="53"/>
    <line x1="11" y1="53" x2="13" y2="51"/>
    <line x1="51" y1="13" x2="53" y2="11"/>
  </g>
</svg>
