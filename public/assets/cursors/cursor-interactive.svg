<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="handShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="handBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Interactive Mechanical Hand Pointer with Sparkle -->
  <g filter="url(#handShadow)">
    <!-- Palm and wrist base -->
    <path d="M 10,13 L 10,7 C 10,5.5 12,5.5 12,7 L 12,12 L 14,8 C 14,6.5 16,6.5 16,8 L 16,13 L 18,9.5 C 18,8 20,8 20,9.5 L 20,15 L 22,12 C 22,10.8 23.5,10.8 23.5,12 C 23.5,15 22,18 20,21 L 18,25 C 17,27 12,27 10,25 L 7,20 C 5.5,18 6,15.5 7.5,15.5 C 8.5,15.5 9.5,17 10,18 Z" 
          fill="url(#handBrass)" 
          stroke="#451a03" 
          stroke-width="1.6" 
          stroke-linejoin="round" />

    <!-- Joint knuckles -->
    <circle cx="11" cy="10" r="1.1" fill="#451a03"/>
    <circle cx="15" cy="11" r="1.1" fill="#451a03"/>
    <circle cx="19" cy="12" r="1.1" fill="#451a03"/>

    <!-- Subtle index finger tip glow -->
    <circle cx="11" cy="6" r="4" fill="url(#sparkGlow)"/>
    <circle cx="11" cy="6" r="1" fill="#ffffff"/>
  </g>
</svg>
