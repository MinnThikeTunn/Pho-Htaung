<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="ironEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <!-- Brass Arrow Pointer -->
  <g filter="url(#shadow)">
    <!-- Main arrow body -->
    <path d="M 3,3 L 13,27 L 17,17 L 27,13 Z" 
          fill="url(#brassGrad)" 
          stroke="url(#ironEdge)" 
          stroke-width="1.8" 
          stroke-linejoin="round" />
    
    <!-- Inner mechanical ridge line -->
    <path d="M 5,6 L 16.5,16.5" 
          stroke="#fef08a" 
          stroke-width="1" 
          stroke-linecap="round" 
          opacity="0.8" />
          
    <!-- Rivet dots -->
    <circle cx="8" cy="11" r="1" fill="#451a03"/>
    <circle cx="14" cy="14" r="1.1" fill="#fef08a"/>
    <circle cx="19" cy="15" r="0.9" fill="#451a03"/>
  </g>
</svg>
